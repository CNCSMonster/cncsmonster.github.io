<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1830" viewBox="0 0 700 1830" role="img" aria-labelledby="title">
<title id="title">Auto Mode · 工具调用审批流程</title>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#334155"/></marker></defs>
<rect width="700" height="1830" fill="#f8fafc"/>
<g font-family="sans-serif">
<g><rect x="100" y="65" width="380" height="55" rx="12" fill="#dbeafe" stroke="#64748b" stroke-width="1.5"/>
<text x="290.0" y="94" text-anchor="middle" fill="#172033" font-size="18" font-weight="700">待审批的工具调用</text>
</g>
<path d="M290 120 V150" fill="none" stroke="#334155" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<g><rect x="100" y="150" width="380" height="125" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
<text x="290.0" y="179" text-anchor="middle" fill="#172033" font-size="18" font-weight="700">工作区内的普通编辑？</text>
<text x="290.0" y="207" text-anchor="middle" fill="#172033" font-size="17" font-weight="500">workspace 内的 edit / write_file</text>
<text x="290.0" y="233" text-anchor="middle" fill="#172033" font-size="17" font-weight="500">且没有匹配 permissions.ask</text>
<text x="290.0" y="259" text-anchor="middle" fill="#172033" font-size="17" font-weight="500">第二节 · 快速通道</text>
</g>
<g><rect x="525" y="186" width="150" height="55" rx="12" fill="#dcfce7" stroke="#64748b" stroke-width="1.5"/>
<text x="600.0" y="215" text-anchor="middle" fill="#172033" font-size="18" font-weight="700">放行</text>
</g>
<path d="M480 213 H525" fill="none" stroke="#334155" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="503" y="199" text-anchor="middle" fill="#172033" font-size="16" font-weight="700">是</text>
<path d="M290 275 V300" fill="none" stroke="#334155" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="315" y="295" text-anchor="middle" fill="#172033" font-size="16" font-weight="700">否</text>
<g><rect x="100" y="300" width="380" height="125" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
<text x="290.0" y="329" text-anchor="middle" fill="#172033" font-size="18" font-weight="700">属于静态安全工具白名单？</text>
<text x="290.0" y="357" text-anchor="middle" fill="#172033" font-size="17" font-weight="500">且没有匹配 permissions.ask</text>
<text x="290.0" y="383" text-anchor="middle" fill="#172033" font-size="17" font-weight="500">第二节 · 快速通道</text>
</g>
<g><rect x="525" y="336" width="150" height="55" rx="12" fill="#dcfce7" stroke="#64748b" stroke-width="1.5"/>
<text x="600.0" y="365" text-anchor="middle" fill="#172033" font-size="18" font-weight="700">放行</text>
</g>
<path d="M480 363 H525" fill="none" stroke="#334155" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="503" y="349" text-anchor="middle" fill="#172033" font-size="16" font-weight="700">是</text>
<path d="M290 425 V450" fill="none" stroke="#334155" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="315" y="445" text-anchor="middle" fill="#172033" font-size="16" font-weight="700">否</text>
<g><rect x="100" y="450" width="380" height="125" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
<text x="290.0" y="479" text-anchor="middle" fill="#172033" font-size="18" font-weight="700">Shell 类调用命中拦截规则？</text>
<text x="290.0" y="507" text-anchor="middle" fill="#172033" font-size="17" font-weight="500">确定性破坏性命令拦截</text>
</g>
<g><rect x="525" y="486" width="150" height="55" rx="12" fill="#fee2e2" stroke="#64748b" stroke-width="1.5"/>
<text x="600.0" y="515" text-anchor="middle" fill="#172033" font-size="18" font-weight="700">拒绝本次调用</text>
</g>
<path d="M480 513 H525" fill="none" stroke="#334155" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="503" y="499" text-anchor="middle" fill="#172033" font-size="16" font-weight="700">是</text>
<path d="M290 575 V600" fill="none" stroke="#334155" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="315" y="595" text-anchor="middle" fill="#172033" font-size="16" font-weight="700">否</text>
<g><rect x="100" y="600" width="380" height="125" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
<text x="290.0" y="629" text-anchor="middle" fill="#172033" font-size="18" font-weight="700">命中用户明确配置的</text>
<text x="290.0" y="657" text-anchor="middle" fill="#172033" font-size="17" font-weight="500">permissions.ask？</text>
</g>
<g><rect x="525" y="636" width="150" height="55" rx="12" fill="#fef3c7" stroke="#64748b" stroke-width="1.5"/>
<text x="600.0" y="665" text-anchor="middle" fill="#172033" font-size="18" font-weight="700">需要人工确认</text>
</g>
<path d="M480 663 H525" fill="none" stroke="#334155" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="503" y="649" text-anchor="middle" fill="#172033" font-size="16" font-weight="700">是</text>
<path d="M290 725 V750" fill="none" stroke="#334155" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="315" y="745" text-anchor="middle" fill="#172033" font-size="16" font-weight="700">否</text>
<path d="M675 664 H688 V1475 H350 V1500" fill="none" stroke="#334155" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<g><rect x="100" y="750" width="380" height="125" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
<text x="290.0" y="779" text-anchor="middle" fill="#172033" font-size="18" font-weight="700">写入类工具的目标路径</text>
<text x="290.0" y="807" text-anchor="middle" fill="#172033" font-size="17" font-weight="500">是否位于工作区外？</text>
</g>
<g><rect x="525" y="786" width="150" height="55" rx="12" fill="#fef3c7" stroke="#64748b" stroke-width="1.5"/>
<text x="600.0" y="815" text-anchor="middle" fill="#172033" font-size="18" font-weight="700">需要人工确认</text>
</g>
<path d="M480 813 H525" fill="none" stroke="#334155" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="503" y="799" text-anchor="middle" fill="#172033" font-size="16" font-weight="700">是</text>
<path d="M290 875 V900" fill="none" stroke="#334155" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="315" y="895" text-anchor="middle" fill="#172033" font-size="16" font-weight="700">否</text>
<path d="M675 814 H688 V1475 H350 V1500" fill="none" stroke="#334155" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<g><rect x="100" y="900" width="380" height="125" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
<text x="290.0" y="929" text-anchor="middle" fill="#172033" font-size="18" font-weight="700">此前失败计数达到阈值？</text>
<text x="290.0" y="957" text-anchor="middle" fill="#172033" font-size="17" font-weight="500">累计阻断与不可用共 20 次，或</text>
<text x="290.0" y="983" text-anchor="middle" fill="#172033" font-size="17" font-weight="500">连续阻断 3 次，或连续不可用 2 次</text>
<text x="290.0" y="1009" text-anchor="middle" fill="#172033" font-size="17" font-weight="500">第五节 · 失败计数与降级</text>
</g>
<g><rect x="525" y="936" width="150" height="55" rx="12" fill="#fef3c7" stroke="#64748b" stroke-width="1.5"/>
<text x="600.0" y="965" text-anchor="middle" fill="#172033" font-size="18" font-weight="700">需要人工确认</text>
</g>
<path d="M480 963 H525" fill="none" stroke="#334155" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="503" y="949" text-anchor="middle" fill="#172033" font-size="16" font-weight="700">是</text>
<path d="M290 1025 V1050" fill="none" stroke="#334155" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="315" y="1045" text-anchor="middle" fill="#172033" font-size="16" font-weight="700">否</text>
<path d="M675 964 H688 V1475 H350 V1500" fill="none" stroke="#334155" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<g><rect x="100" y="1050" width="380" height="112" rx="12" fill="#dbeafe" stroke="#64748b" stroke-width="1.5"/>
<text x="290.0" y="1079" text-anchor="middle" fill="#172033" font-size="18" font-weight="700">构造审查上下文 Transcript</text>
<text x="290.0" y="1107" text-anchor="middle" fill="#172033" font-size="17" font-weight="500">过滤会话内容、改写历史调用、</text>
<text x="290.0" y="1133" text-anchor="middle" fill="#172033" font-size="17" font-weight="500">投影当前参数 · 第三节</text>
</g>
<path d="M290 1162 V1190" fill="none" stroke="#334155" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<g><rect x="100" y="1190" width="380" height="112" rx="12" fill="#dbeafe" stroke="#64748b" stroke-width="1.5"/>
<text x="290.0" y="1219" text-anchor="middle" fill="#172033" font-size="18" font-weight="700">两阶段 Classifier 审查</text>
<text x="290.0" y="1247" text-anchor="middle" fill="#172033" font-size="17" font-weight="500">Stage 1 快速判断；明确阻断才进入</text>
<text x="290.0" y="1273" text-anchor="middle" fill="#172033" font-size="17" font-weight="500">Stage 2 复核 · 第四节</text>
</g>
<path d="M290 1302 V1320 H125 V1360" fill="none" stroke="#334155" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M290 1302 V1320 H335 V1360" fill="none" stroke="#334155" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M290 1302 V1320 H550 V1360" fill="none" stroke="#334155" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<g><rect x="35" y="1360" width="180" height="85" rx="12" fill="#dcfce7" stroke="#64748b" stroke-width="1.5"/>
<text x="125.0" y="1389" text-anchor="middle" fill="#172033" font-size="18" font-weight="700">判定可执行</text>
<text x="125.0" y="1417" text-anchor="middle" fill="#172033" font-size="17" font-weight="500">放行</text>
</g>
<g><rect x="230" y="1360" width="210" height="85" rx="12" fill="#fee2e2" stroke="#64748b" stroke-width="1.5"/>
<text x="335.0" y="1389" text-anchor="middle" fill="#172033" font-size="18" font-weight="700">明确判定不应执行</text>
<text x="335.0" y="1417" text-anchor="middle" fill="#172033" font-size="17" font-weight="500">拒绝本次调用</text>
</g>
<g><rect x="465" y="1360" width="200" height="85" rx="12" fill="#fef3c7" stroke="#64748b" stroke-width="1.5"/>
<text x="565.0" y="1389" text-anchor="middle" fill="#172033" font-size="18" font-weight="700">Classifier 不可用</text>
<text x="565.0" y="1417" text-anchor="middle" fill="#172033" font-size="17" font-weight="500">需要人工确认</text>
</g>
<path d="M550 1445 V1475 H350 V1500" fill="none" stroke="#334155" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<g><rect x="100" y="1500" width="500" height="60" rx="12" fill="#fef3c7" stroke="#64748b" stroke-width="1.5"/>
<text x="350.0" y="1529" text-anchor="middle" fill="#172033" font-size="18" font-weight="700">所有“需要人工确认”的分支在此汇合</text>
</g>
<path d="M350 1560 V1590" fill="none" stroke="#334155" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<g><rect x="150" y="1590" width="400" height="80" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
<text x="350.0" y="1619" text-anchor="middle" fill="#172033" font-size="18" font-weight="700">是否可交互确认？</text>
<text x="350.0" y="1647" text-anchor="middle" fill="#172033" font-size="17" font-weight="500">第四节 · 审查不可用时转人工确认</text>
</g>
<path d="M350 1670 V1695 H180 V1740" fill="none" stroke="#334155" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M350 1670 V1695 H520 V1740" fill="none" stroke="#334155" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="180" y="1721" text-anchor="middle" fill="#172033" font-size="17" font-weight="700">可以（交互式会话）</text>
<text x="520" y="1721" text-anchor="middle" fill="#172033" font-size="17" font-weight="700">不可以（普通非交互运行）</text>
<g><rect x="30" y="1740" width="300" height="65" rx="12" fill="#fef3c7" stroke="#64748b" stroke-width="1.5"/>
<text x="180.0" y="1769" text-anchor="middle" fill="#172033" font-size="18" font-weight="700">弹出确认，交给用户决定</text>
</g>
<g><rect x="370" y="1740" width="300" height="65" rx="12" fill="#fee2e2" stroke="#64748b" stroke-width="1.5"/>
<text x="520.0" y="1769" text-anchor="middle" fill="#172033" font-size="18" font-weight="700">无法确认，拒绝本次调用</text>
</g>
<text x="350" y="40" text-anchor="middle" fill="#172033" font-size="23" font-weight="700">Auto Mode · 工具调用审批流程</text>
</g>
</svg>
