# Ref: https://github.com/getzola/zola
# Deploy to GitHub Pages

name: GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:  # 允许手动触发

jobs:
  deploy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Zola
        run: |
          curl -L -o zola.tar.gz https://github.com/getzola/zola/releases/download/v0.22.1/zola-v0.22.1-x86_64-unknown-linux-gnu.tar.gz
          tar xzf zola.tar.gz
          sudo mv zola /usr/local/bin/
          rm zola.tar.gz
          zola --version

      # 本地验证（zola 0.22.1）与 CI 必须同版本，否则本地构建通过 ≠ 线上构建通过
      - name: Check bilingual pairs
        run: bash tools/check-pairs.sh

      # WARN 视为失败：缺 date/weight 的页面不会构建（404）却只报 WARN
      - name: Build (warnings fail the build)
        run: |
          set -o pipefail
          LOG=$(mktemp)
          zola build 2>&1 | tee "$LOG"
          if grep -q "WARN" "$LOG"; then
            echo "Build produced warnings — fix them before deploying."
            grep "WARN" "$LOG"
            exit 1
          fi

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          force_orphan: true

