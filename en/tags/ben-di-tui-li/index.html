/article></div><a class=view-all href=https://cncsmonster.github.io/posts/>← Back to all posts</a></section></main><footer class=site-footer><p>© 2026 CCM. Powered by Zola.<div class=footer-links><a href=https://cncsmonster.github.io/>↑ Back to Home</a><span class=separator>|</span><a href=https://cncsmonster.github.io/archive/>Archive</a><span class=separator>|</span><a href=https://cncsmonster.github.io/ebooks/>Ebooks</a><span class=separator>|</span><a href=https://cncsmonster.github.io/atom.xml rel=noopener target=_blank>Atom</a><span class=separator>|</span><a href=https://cncsmonster.github.io/rss.xml rel=noopener target=_blank>RSS</a></div></footer><script defer src=https://cncsmonster.github.io/js/mermaid.js></script><script src=https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js></script><script src=https://cncsmonster.github.io/search_index.en.js></script><script>(function() {
        let fuse = null;
        const searchIndex = window.searchIndex || [];
        
        // 初始化 Fuse.js
        function initFuse() {
            if (fuse) return true;
            
            if (!searchIndex || searchIndex.length === 0) {
                console.warn('搜索索引为空');
                return false;
            }
            
            try {
                // Fuse.js 配置
                const options = {
                    includeScore: false,
                    includeMatches: true,
                    ignoreLocation: true,
                    threshold: 0.15,
                    minMatchCharLength: 1,
                    keys: [
                        { name: 'title', weight: 3 },
                        { name: 'description', weight: 2 },
                        { name: 'body', weight: 1 },
                        { name: 'path', weight: 0.5 }
                    ]
                };
                
                fuse = new Fuse(searchIndex, options);
                console.log('搜索初始化成功，条目数:', searchIndex.length);
                return true;
                
            } catch (error) {
                console.error('Fuse 初始化失败:', error);
                return false;
            }
        }
        
        // 绑定搜索事件
        function bindSearch() {
            const searchInput = document.getElementById('search-input');
            const searchResults = document.getElementById('search-results');
            
            if (!searchInput || !searchResults) return;
            
            let debounceTimer = null;
            
            searchInput.addEventListener('input', function() {
                const query = this.value.trim();
                
                if (query.length === 0) {
                    searchResults.innerHTML = '';
                    searchResults.style.display = 'none';
                    return;
                }
                
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => {
                    // 确保 Fuse 已初始化
                    if (!fuse && !initFuse()) {
                        searchResults.innerHTML = '<li class="no-results">Loading search...</li>';
                        searchResults.style.display = 'block';
                        return;
                    }
                    
                    const results = fuse.search(query);
                    const MAX_RESULTS = 10;
                    
                    if (results.length === 0) {
                        searchResults.innerHTML = '<li class="no-results">No results found</li>';
                    } else {
                        searchResults.innerHTML = results.slice(0, MAX_RESULTS).map(result => {
                            const doc = result.item;
                            const title = highlightMatch(doc.title, query);
                            const description = doc.description ? highlightMatch(doc.description, query) : '';
                            return '<li class="search-result"><a href="' + doc.path + '"><h4>' + title + '</h4>' + (description ? '<p>' + description + '</p>' : '') + '</a></li>';
                        }).join('');
                    }
                    
                    searchResults.style.display = 'block';
                }, 150);
            });
            
            document.addEventListener('click', function(e) {
                if (!e.target.closest('.search-container')) {
                    searchResults.style.display = 'none';
                }
            });
        }
        
        // 高亮匹配文本
        function highlightMatch(text, query) {
            if (!text) return '';
            const regex = new RegExp('(' + escapeRegExp(query) + ')', 'gi');
            return text.replace(regex, '<mark>$1</mark>');
        }
        
        // 转义正则特殊字符
        function escapeRegExp(string) {
            return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }
        
        // 页面加载完成后初始化
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
        
        function init() {
            initFuse();
            bindSearch();
        }
    })();</script>
